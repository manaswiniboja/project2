<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Faculty Registration</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-br from-green-100 to-gray-100 flex items-center justify-center min-h-screen">

    <div class="bg-white shadow-2xl rounded-2xl p-8 w-full max-w-sm">

        <h2 class="text-2xl font-bold mb-6 text-center text-gray-800">
            Faculty Registration
        </h2>

        <!-- Django Messages -->
        {% if messages %}
            <div class="mb-4">
                {% for message in messages %}
                    {% if message.tags == 'error' %}
                        <div class="text-red-600 text-sm mb-2">
                            {{ message }}
                        </div>
                    {% elif message.tags == 'success' %}
                        <div class="text-green-600 text-sm mb-2">
                            {{ message }}
                        </div>
                    {% endif %}
                {% endfor %}
            </div>
        {% endif %}

        <!-- Registration Form -->
        <form method="POST" class="space-y-4" autocomplete="off">
            {% csrf_token %}

            <input type="text"
                   name="username"
                   placeholder="Username"
                   required
                   class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">

            <input type="password"
                   name="password"
                   placeholder="Password"
                   required
                   class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">

            <input type="password"
                   name="password2"
                   placeholder="Confirm Password"
                   required
                   class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">

            <button type="submit"
                    class="w-full bg-green-600 text-white py-2 rounded-lg hover:bg-green-700 transition duration-300">
                Register
            </button>
        </form>

        <!-- Login Links -->
        <div class="text-center mt-6">
            <p class="text-gray-600 text-sm">
                Already have an account?
                <a href="{% url 'login' %}"
                   class="text-green-600 font-medium hover:underline">
                    Login
                </a>
            </p>

            <a href="{% url 'login' %}"
               class="block mt-4 w-full text-center bg-gray-200 text-gray-800 py-2 rounded-lg hover:bg-gray-300 transition duration-300">
                Back to Login
            </a>
        </div>

    </div>

</body>
</html>
