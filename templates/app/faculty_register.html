<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Faculty Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container d-flex justify-content-center align-items-center" style="min-height:100vh;">
    <div class="card p-4 shadow" style="width: 350px;">
        <h3 class="text-center mb-4 text-primary">Faculty Register</h3>

        {% if error %}
            <div class="alert alert-danger">{{ error }}</div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Faculty_ID</label>
                <input type="text" name="faculty_id" class="form-control" required autocomplete="off">
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
               <input type="password" name="password" class="form-control" required autocomplete="off">
            </div>
            <button type="submit" class="btn btn-primary w-100">Create Account</button>
        </form>

        <div class="mt-3 text-center">
            <a href="{% url 'login' %}">Back to Login</a>
        </div>
    </div>
</div>
<script>
document.querySelector('form').addEventListener('submit', function() {
    setTimeout(() => this.reset(), 10);  // Reset after submit
});
</script>

</body>
</html>
