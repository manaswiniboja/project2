<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Registration</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="bg-white shadow-lg rounded-lg p-8 w-full max-w-sm">
        <h2 class="text-2xl font-bold mb-6 text-center text-gray-800">Student Registration</h2>
        <form method="POST" action="{% url 'student_register' %}">
    {% csrf_token %}
            <input type="text" name="username" placeholder="Username" required 
                   class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            <input type="password" name="password" placeholder="Password" required 
                   class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition duration-300">
                Register
            </button>
        </form>
        <p class="text-center mt-4 text-gray-600">Already have an account? 
            <a href="/login" class="text-blue-600 hover:underline">Login</a>
             <a href="/login" class="block mt-4 w-full text-center bg-gray-200 text-gray-800 py-2 rounded-lg hover:bg-gray-300 transition duration-300">
            Back to Login
        </a>
        </p>
    </div>
</body>
</html>
