<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Student Management Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e3f2fd, #f4f7f8);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-container {
            background: #ffffff;
            padding: 40px 35px;
            border-radius: 14px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            width: 380px;
            text-align: center;
        }

        .login-title {
            font-size: 26px;
            font-weight: 600;
            margin-bottom: 25px;
            color: #222;
        }

        .messages {
            margin-bottom: 15px;
        }

        .error-message {
            color: #d32f2f;
            font-size: 14px;
            margin-bottom: 6px;
            text-align: left;
        }

        .success-message {
            color: #2e7d32;
            font-size: 14px;
            margin-bottom: 6px;
            text-align: left;
        }

        form {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: 500;
            margin-bottom: 6px;
            font-size: 14px;
            text-align: left;
        }

        select,
        input {
            padding: 10px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
            transition: 0.2s ease;
        }

        select:focus,
        input:focus {
            border-color: #1976d2;
            outline: none;
        }

        button {
            padding: 12px;
            background-color: #1976d2;
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s ease;
        }

        button:hover {
            background-color: #115293;
        }

        .register-links {
            margin-top: 20px;
            font-size: 14px;
        }

        .register-links a {
            color: #1976d2;
            text-decoration: none;
            font-weight: 500;
        }

        .register-links a:hover {
            text-decoration: underline;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 999;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
        }

        .modal-content {
            background-color: #fff;
            margin: 15% auto;
            padding: 35px;
            border-radius: 14px;
            width: 360px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            position: relative;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                transform: translateY(-20px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-content h3 {
            margin-bottom: 25px;
            font-size: 20px;
            color: #333;
        }

        .choice-buttons a {
            display: block;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            text-decoration: none;
            color: #fff;
            font-weight: 500;
            background-color: #1976d2;
            transition: 0.2s ease;
        }

        .choice-buttons a:hover {
            background-color: #115293;
        }

        .close {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 22px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="login-container">
        <div class="login-title">Student Management Login</div>

        <div class="messages">
            {% for message in messages %}
            {% if message.tags == 'error' %}
            <div class="error-message">{{ message }}</div>
            {% elif message.tags == 'success' %}
            <div class="success-message">{{ message }}</div>
            {% endif %}
            {% endfor %}
        </div>

        <form method="POST" autocomplete="off">
            {% csrf_token %}

            <label>Login As</label>
            <select name="role" required>
                <option value="">Select Role</option>
                <option value="student">Student</option>
                <option value="faculty">Faculty</option>
            </select>

            <label>Username</label>
            <input type="text" name="username" placeholder="Enter your username" autocomplete="new-username" required>

            <label>Password</label>
            <input type="password" name="password" placeholder="Enter your password" autocomplete="new-password"
                required>

            <button type="submit">Login</button>
        </form>

        <div class="register-links">
            Don’t have an account?
            <a href="#" id="createAccountBtn">Create account</a>
        </div>
    </div>

    <!-- Modal -->
    <div id="accountModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h3>Register as</h3>
            <div class="choice-buttons">
                <a href="{% url 'student_register' %}">Student</a>
                <a href="{% url 'faculty_register' %}">Faculty</a>
            </div>
        </div>
    </div>

    <script>
        const modal = document.getElementById("accountModal");
        const createBtn = document.getElementById("createAccountBtn");
        const closeBtn = document.querySelector(".close");

        createBtn.onclick = function (e) {
            e.preventDefault();
            modal.style.display = "block";
        };

        closeBtn.onclick = function () {
            modal.style.display = "none";
        };

        window.onclick = function (e) {
            if (e.target === modal) {
                modal.style.display = "none";
            }
        };
    </script>

</body>

</html>
