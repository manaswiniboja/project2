<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <style>
        body {
            background-color: #f2f2f2;
            font-family: Arial, sans-serif;
        }

        .main-container {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            width: 350px;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        .login-title {
            text-align: center;
            font-size: 22px;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
        }

        .form-group input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .login-btn {
            width: 100%;
            padding: 10px;
            background-color: #007BFF;
            border: none;
            color: white;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }

        .login-btn:hover {
            background-color: #0056b3;
        }

        .error-message {
            color: red;
            text-align: center;
            margin-bottom: 10px;
        }

        .register-links {
            text-align: center;
            margin-top: 15px;
        }

        .register-links a {
            text-decoration: none;
            color: #007BFF;
        }

        .register-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="main-container">
    <div class="login-box">

        <div class="login-title">
            Student Management Login
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="error-message">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <div class="form-group">
                <label>Username</label>
              <input type="text" name="username" placeholder="Username" required autocomplete="off">
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Password" required autocomplete="new-password">
            </div>

            <div>
                <button type="submit" class="login-btn">Login</button>
            </div>

        </form>

        <div class="register-links">
            <p>
                Faculty? <a href="{% url 'faculty_register' %}">Register Here</a>
            </p>
            <p>
                Student? <a href="{% url 'student_register' %}">Register Here</a>
            </p>
        </div>

    </div>
</div>

</body>
</html>
