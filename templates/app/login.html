<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Management Login</title>
    <style>
        /* Reset */
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f4f7f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* Login Card */
        .login-container {
            background: #fff;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 360px;
            text-align: center;
        }

        .login-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 25px;
            color: #333;
        }

        .messages {
            margin-bottom: 15px;
        }

        .messages .error-message {
            color: #d32f2f;
            font-size: 14px;
            margin-bottom: 5px;
            text-align: left;
        }

        .messages .success-message {
            color: #388e3c;
            font-size: 14px;
            margin-bottom: 5px;
            text-align: left;
        }

        form {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: 500;
            margin-bottom: 5px;
            font-size: 14px;
            text-align: left;
        }

        select, input {
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }

        button {
            padding: 12px;
            background-color: #1976d2;
            border: none;
            border-radius: 6px;
            color: #fff;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #115293;
        }

        .register-links {
            margin-top: 20px;
            font-size: 14px;
        }

        .register-links a {
            color: #1976d2;
            text-decoration: none;
            margin: 0 5px;
            cursor: pointer;
        }

        .register-links a:hover {
            text-decoration: underline;
        }

        /* Modal Styles */
        .modal {
            display: none; /* Hidden by default */
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.5);
        }

        .modal-content {
            background-color: #fff;
            margin: 15% auto;
            padding: 40px 30px;
            border-radius: 12px;
            width: 360px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            position: relative;
        }

        .modal-content h3 {
            margin-bottom: 25px;
            font-size: 22px;
            color: #333;
        }

        .modal-content .choice-buttons a {
            display: block;
            padding: 12px;
            margin: 10px 0;
            border-radius: 6px;
            text-decoration: none;
            color: #fff;
            font-weight: 500;
            background-color: #1976d2;
            transition: background-color 0.2s;
        }

        .modal-content .choice-buttons a:hover {
            background-color: #115293;
        }

        .close {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 24px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <!-- Login Card -->
    <div class="login-container">
        <div class="login-title">Student Management Login</div>

        <div class="messages">
            {% for message in messages %}
                {% if message.tags == 'error' %}
                    <div class="error-message">{{ message }}</div>
                {% elif message.tags == 'success' %}
                    <div class="success-message">{{ message }}</div>
                {% endif %}
            {% endfor %}
        </div>

        <form method="POST">
            {% csrf_token %}
            <label for="username">Username</label>
            <input type="text" name="username" id="username" placeholder="Enter your username" required>

            <label for="password">Password</label>
            <input type="password" name="password" id="password" placeholder="Enter your password" required>

            <button type="submit">Login</button>
        </form>

        <div class="register-links">
            Don't you have an account? 
            <a>Create account</a>
        </div>
    </div>

    <!-- Modal Popup -->
    <div id="accountModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h3>Register as:</h3>
            <div class="choice-buttons">
                <a href="{% url 'student_register' %}">Student</a>
                <a href="{% url 'faculty_register' %}">Faculty</a>
            </div>
        </div>
    </div>

    <!-- Modal Script -->
    <script>
        var modal = document.getElementById("accountModal");
        var createAccountLink = document.querySelector(".register-links a");
        var spanClose = document.getElementsByClassName("close")[0];

        // Open modal
        createAccountLink.onclick = function(event) {
            event.preventDefault();
            modal.style.display = "block";
        }

        // Close modal on X
        spanClose.onclick = function() {
            modal.style.display = "none";
        }

        // Close modal on click outside
        window.onclick = function(event) {
            if (event.target == modal) {
                modal.style.display = "none";
            }
        }
    </script>
</body>
</html>
